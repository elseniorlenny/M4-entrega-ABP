<!-- SECCIÓN OPCIONES - CON ESTILO Y FORMA DE VENTAS -->
<div class="bento-grid">

    <!-- DATOS DE LA TIENDA (BENTO SPAN 6) -->
    <div class="bento-card bento-6">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark"><i class="bi bi-shop me-1 text-primary"></i> Datos de la Tienda</h6>
            <span class="badge px-2 py-1 fw-bold" style="background:#e0e7ff; color:#3730a3;">Configuración</span>
        </div>
        <form id="form-tienda">
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small fw-semibold">Nombre / Razón Social</label>
                    <input type="text" id="opt-nombre-tienda" class="form-control">
                </div>
                <div class="col-6">
                    <label class="form-label small fw-semibold">RUT Empresa</label>
                    <input type="text" id="opt-rut" class="form-control" placeholder="76.123.456-7">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Dirección Comercial</label>
                <input type="text" id="opt-direccion" class="form-control">
            </div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small fw-semibold">Teléfono</label>
                    <input type="text" id="opt-telefono" class="form-control" placeholder="+569 1234 5678">
                </div>
                <div class="col-6">
                    <label class="form-label small fw-semibold">Sitio Web</label>
                    <input type="url" id="opt-web" class="form-control" placeholder="www.construshop.cl">
                </div>
            </div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small fw-semibold">Email de Contacto</label>
                    <input type="email" id="opt-email" class="form-control">
                </div>
                <div class="col-6">
                    <label class="form-label small fw-semibold">Nombre de Contacto</label>
                    <input type="text" id="opt-contacto" class="form-control" placeholder="Gerente General">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Giro</label>
                <input type="text" id="opt-giro" class="form-control" placeholder="Venta de materiales de construcción">
            </div>
            <button type="submit" class="btn btn-indigo w-100 py-2">
                <i class="bi bi-save me-1"></i> Guardar Cambios Tienda
            </button>
        </form>
    </div>

    <!-- INFORMACIÓN DEL SISTEMA (BENTO SPAN 6) -->
    <div class="bento-card bento-6">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark"><i class="bi bi-info-circle-fill me-1 text-info"></i> Información del Sistema</h6>
            <span class="badge bg-info text-dark px-2 py-1 fw-bold">v4.0 POO</span>
        </div>
        <div id="info-sistema-datos"></div>
    </div>

    <!-- ZONA DE RESTABLECIMIENTO (BENTO SPAN 12 CENTRADO) -->
    <div class="bento-card bento-12 mt-3 border-danger mx-auto" style="max-width: 680px;">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-danger"><i class="bi bi-exclamation-triangle-fill me-1"></i> Restablecimiento de Base de Datos</h6>
            <span class="badge bg-danger text-white px-2 py-1 fw-bold">Zona de Riesgo</span>
        </div>
        <p class="text-secondary small mb-3 text-center">
            Reinicia todos los registros de inventario, ventas, bodega, tareas POO y proveedores al estado base original provisto por el sistema.
        </p>
        <div class="text-center">
            <button id="btn-reset-datos" class="btn btn-rose py-2 px-4">
                <i class="bi bi-arrow-counterclockwise me-1"></i> Resetear Datos (Volver a Estado Base)
            </button>
        </div>
    </div>

</div>
