<!-- BARRA DE HERRAMIENTAS MÓDULO BODEGA -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;background:var(--bg-card);padding:12px;border:1px solid var(--border);border-radius:var(--radius)">
    <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:260px">
        <span style="font-weight:600;font-size:0.9em">🔍 Buscar:</span>
        <input type="text" id="input-busqueda-bodega" placeholder="Filtrar por SKU, cliente, material, trabajador..." style="flex:1;padding:6px 10px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius)">
    </div>
    <div style="display:flex;gap:8px">
        <button id="btn-nueva-tarea-bodega" onclick="abrirModalNuevaTarea('entrega')" style="background:var(--primary);color:#000;font-weight:600;padding:6px 12px">+ Nueva Tarea</button>
        <button id="btn-api-bodega" onclick="sincronizarConAPIExterna()" style="background:#0dcaf0;color:#000;font-weight:600;padding:6px 12px">🌐 Cargar API</button>
    </div>
</div>

<!-- KANBAN 4 COLUMNAS SUPERIORES -->
<div class="kanban">
    <!-- COLUMNA 1: ENTRANTE -->
    <div class="kanban-col">
        <div class="kanban-header">
            <span>📥 Entrante</span>
            <span class="kanban-badge" id="kanban-ent-count">0</span>
        </div>
        <div class="kanban-drop" id="kanban-entrantes"></div>
    </div>

    <!-- COLUMNA 2: EN PROCESO -->
    <div class="kanban-col">
        <div class="kanban-header">
            <span>⚙️ En Proceso</span>
            <span class="kanban-badge" id="kanban-proc-count">0</span>
        </div>
        <div class="kanban-drop" id="kanban-proceso"></div>
    </div>

    <!-- COLUMNA 3: ENTREGADO -->
    <div class="kanban-col">
        <div class="kanban-header">
            <span>✅ Entregado</span>
            <span class="kanban-badge" id="kanban-term-count">0</span>
        </div>
        <div class="kanban-drop" id="kanban-terminado"></div>
    </div>

    <!-- COLUMNA 4: ENVÍO TAREAS -->
    <div class="kanban-col">
        <div class="kanban-header">
            <span>📤 Envío Tareas</span>
            <span class="kanban-badge" id="kanban-alert-count">0</span>
        </div>
        <div class="kanban-body" style="display:flex;flex-direction:column;padding:6px;height:420px;box-sizing:border-box">
            <div class="kanban-drop" id="bodega-envio-drop" style="flex:1;overflow-y:auto;border:none;padding:0">
                <div class="kanban-empty">Sin alertas de stock pendientes</div>
            </div>
            <div style="margin-top:auto;padding-top:6px;border-top:1px solid var(--border)">
                <button id="btn-enviar-todo-bodega" onclick="appEnviarTodasAlertasBodega()" style="width:100%;font-weight:bold;background:var(--success);padding:8px" disabled>🚀 Enviar Todo</button>
            </div>
        </div>
    </div>
</div>

<!-- COLUMNA ANCHA: INVENTARIO -->
<div style="margin-top:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);overflow:hidden">
    <div class="kanban-header" style="justify-content:space-between">
        <span>📦 Inventario General de Bodega</span>
    </div>
    <div class="scroll-box" style="border:none;border-radius:0;padding:0;max-height:350px">
        <table>
            <thead>
                <tr>
                    <th style="text-align:center">SKU</th>
                    <th style="text-align:center">Material</th>
                    <th style="text-align:center">Marca</th>
                    <th style="text-align:center">Color</th>
                    <th style="text-align:center">Espesor</th>
                    <th style="text-align:center">Stock</th>
                    <th style="text-align:center">Estado</th>
                    <th style="text-align:center">Acción</th>
                </tr>
            </thead>
            <tbody id="bodega-inv-lista"></tbody>
        </table>
    </div>
</div>
