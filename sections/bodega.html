<!-- SECCIÓN BODEGA - CON ESTILO Y FORMA DE VENTAS -->

<!-- KANBAN COLUMNAS LADO A LADO CON ESTILO VENTAS -->
<div class="kanban-bento mb-3">

    <!-- COLUMNA 1: TAREAS ENTRANTES -->
    <div class="bento-card p-3 d-flex flex-column" style="height: 480px;">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark"><i class="bi bi-inbox me-1 text-primary"></i> Tareas Entrantes</h6>
            <span class="badge bg-primary text-white px-2 py-1 fw-bold" id="bod-ent-count">0</span>
        </div>
        <div class="bento-scroll-block flex-grow-1" id="bod-entrantes" style="max-height: 380px; overflow-y: auto;"></div>
    </div>

    <!-- COLUMNA 2: EN PROCESO -->
    <div class="bento-card p-3 d-flex flex-column" style="height: 480px;">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark"><i class="bi bi-gear-wide-connected me-1 text-warning"></i> En Proceso</h6>
            <span class="badge bg-warning text-dark px-2 py-1 fw-bold" id="bod-proc-count">0</span>
        </div>
        <div class="bento-scroll-block flex-grow-1" id="bod-proceso" style="max-height: 380px; overflow-y: auto;"></div>
    </div>

    <!-- COLUMNA 3: ENTREGADOS / ANULADOS -->
    <div class="bento-card p-3 d-flex flex-column" style="height: 480px;">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark"><i class="bi bi-check-circle me-1 text-success"></i> Entregados / Anulados</h6>
            <span class="badge bg-success text-white px-2 py-1 fw-bold" id="bod-comp-count">0</span>
        </div>
        <div class="bento-scroll-block flex-grow-1" id="bod-entregados" style="max-height: 380px; overflow-y: auto;"></div>
    </div>

    <!-- COLUMNA 4: ENVÍO TAREAS -->
    <div class="bento-card p-3 d-flex flex-column" style="height: 480px;">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark"><i class="bi bi-send me-1 text-success"></i> Envío Tareas</h6>
            <span class="badge bg-success text-white px-2 py-1 fw-bold" id="envio-bodega-count">0</span>
        </div>
    <div class="bento-scroll-block flex-grow-1" id="envio-bodega-drop" style="max-height: 380px; overflow-y: auto;">
        <div class="text-center text-muted py-4 small">Sin tareas pendientes</div>
    </div>
    </div>

</div>

<!-- SECCIÓN INVENTARIO BODEGA (TABLA CON ESTILO DE HISTORIAL DE VENTAS) -->
<div class="bento-card bento-12">
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
        <h6 class="m-0 fw-bold text-dark"><i class="bi bi-boxes me-1 text-primary"></i> Stock Físico en Bodega</h6>
    </div>
    <div class="bento-scroll-block" style="max-height: 320px;">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr class="table-light">
                    <th class="text-center text-dark">SKU</th>
                    <th class="text-center text-dark">Material</th>
                    <th class="text-center text-dark">Color</th>
                    <th class="text-center text-dark">Espesor</th>
                    <th class="text-center text-dark">Dimensiones (Largo x Ancho)</th>
                    <th class="text-center text-dark">Marca</th>
                    <th class="text-center text-dark">Categoría</th>
                    <th class="text-center text-dark">Stock Actual</th>
                    <th class="text-center text-dark">Estado Stock</th>
                    <th class="text-center text-dark">Acción Directa</th>
                </tr>
            </thead>
            <tbody id="tbody-inventario-bodega"></tbody>
        </table>
    </div>
</div>
