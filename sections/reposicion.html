<!-- SECCIÓN REPOSICIÓN - CON ESTILO Y FORMA DE VENTAS -->

<!-- KANBAN COLUMNAS LADO A LADO CON ESTILO VENTAS -->
<div class="kanban-bento mb-3">

    <!-- COLUMNA 1: ENTRANTE -->
    <div class="bento-card p-3 d-flex flex-column" style="height: 480px;">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark"><i class="bi bi-inbox me-1 text-primary"></i> Entrante</h6>
            <span class="badge bg-primary text-white px-2 py-1 fw-bold" id="repo-ent-count">0</span>
        </div>
        <div class="bento-scroll-block flex-grow-1" id="repo-entrantes" style="max-height: 380px; overflow-y: auto;"></div>
    </div>

    <!-- COLUMNA 2: PROCESO DE COMPRA -->
    <div class="bento-card p-3 d-flex flex-column" style="height: 480px;">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark"><i class="bi bi-bag-check me-1 text-warning"></i> Proceso Compra</h6>
            <span class="badge bg-warning text-dark px-2 py-1 fw-bold" id="repo-proc-count">0</span>
        </div>
        <div class="bento-scroll-block flex-grow-1" id="repo-proceso" style="max-height: 380px; overflow-y: auto;"></div>
    </div>

    <!-- COLUMNA 3: RECEPCIÓN -->
    <div class="bento-card p-3 d-flex flex-column" style="height: 480px;">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark"><i class="bi bi-box-seam me-1 text-success"></i> Recepción</h6>
            <span class="badge bg-success text-white px-2 py-1 fw-bold" id="repo-comp-count">0</span>
        </div>
        <div class="bento-scroll-block flex-grow-1" id="repo-completado" style="max-height: 380px; overflow-y: auto;"></div>
    </div>

    <!-- COLUMNA 4: PROVEEDORES -->
    <div class="bento-card p-3 d-flex flex-column" style="height: 480px;">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark"><i class="bi bi-building me-1 text-primary"></i> Proveedores</h6>
            <button id="btn-add-proveedor" onclick="appRepoAbrirFormProveedor()" class="btn btn-outline-primary btn-sm py-1 px-2" style="font-size:0.75rem;">
                <i class="bi bi-plus-lg me-1"></i>Nuevo
            </button>
        </div>
        <div class="bento-scroll-block flex-grow-1" style="max-height: 380px; overflow-y: auto;">
            <div id="lista-proveedores"></div>
        </div>
    </div>

</div>

<!-- SECCIÓN INVENTARIO REPOSICIÓN (TABLA CON ESTILO DE HISTORIAL DE VENTAS) -->
<div class="bento-card bento-12 mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
        <h6 class="m-0 fw-bold text-dark"><i class="bi bi-box-seam me-1 text-primary"></i> Control de Insumos & Reposición</h6>
    </div>
    <div class="bento-scroll-block" style="max-height: 320px;">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr class="table-light">
                    <th class="text-center text-dark">SKU</th>
                    <th class="text-center text-dark">Material</th>
                    <th class="text-center text-dark">Color</th>
                    <th class="text-center text-dark">Espesor</th>
                    <th class="text-center text-dark">Dimensiones (Largo x Ancho)</th>
                    <th class="text-center text-dark">Marca</th>
                    <th class="text-center text-dark">Categoría</th>
                    <th class="text-center text-dark">Stock Actual</th>
                    <th class="text-center text-dark">Estado Stock</th>
                    <th class="text-center text-dark">Acción Directa</th>
                </tr>
            </thead>
            <tbody id="tbody-inventario-reposicion"></tbody>
        </table>
    </div>
</div>

<!-- MODAL PROVEEDOR -->
<div id="modal-proveedor" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.4);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center">
    <div class="bento-card bg-white shadow-lg" style="width:420px;max-width:92%">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="m-0 fw-bold text-dark" id="prov-form-titulo"><i class="bi bi-building me-1 text-primary"></i> Proveedor</h6>
            <button type="button" class="btn-close" onclick="appRepoCerrarFormProveedor()"></button>
        </div>
        <input type="hidden" id="prov-form-id">
        <div class="mb-2">
            <label class="form-label small fw-semibold">Empresa</label>
            <input type="text" id="prov-form-nombre" class="form-control">
        </div>
        <div class="mb-2">
            <label class="form-label small fw-semibold">Contacto Directo</label>
            <input type="text" id="prov-form-contacto" class="form-control">
        </div>
        <div class="mb-2">
            <label class="form-label small fw-semibold">Teléfono</label>
            <input type="text" id="prov-form-telefono" class="form-control">
        </div>
        <div class="mb-2">
            <label class="form-label small fw-semibold">Email</label>
            <input type="email" id="prov-form-email" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold">Marcas</label>
            <input type="text" id="prov-form-marcas" class="form-control" placeholder="Ej. Masisa, Arauco">
        </div>
        <div class="d-flex gap-2">
            <button onclick="appRepoGuardarProveedor()" class="btn btn-outline-primary flex-grow-1"><i class="bi bi-save me-1"></i>Guardar</button>
            <button onclick="appRepoCerrarFormProveedor()" class="btn btn-outline-secondary px-3">Cancelar</button>
        </div>
    </div>
</div>
