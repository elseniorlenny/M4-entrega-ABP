<!-- BARRA DE HERRAMIENTAS MÓDULO REPOSICIÓN -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;background:var(--bg-card);padding:12px;border:1px solid var(--border);border-radius:var(--radius)">
    <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:260px">
        <span style="font-weight:600;font-size:0.9em">🔍 Buscar:</span>
        <input type="text" id="input-busqueda-reposicion" placeholder="Filtrar por SKU, proveedor, notas, id..." style="flex:1;padding:6px 10px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius)">
    </div>
    <div style="display:flex;gap:8px">
        <button id="btn-nueva-tarea-reposicion" onclick="abrirModalNuevaTarea('reposicion')" style="background:var(--primary);color:#000;font-weight:600;padding:6px 12px">+ Nueva Tarea</button>
        <button id="btn-api-reposicion" onclick="sincronizarConAPIExterna()" style="background:#0dcaf0;color:#000;font-weight:600;padding:6px 12px">🌐 Cargar API</button>
    </div>
</div>

<!-- KANBAN 4 COLUMNAS SUPERIORES -->
<div class="kanban">
    <!-- COLUMNA 1: ENTRANTE -->
    <div class="kanban-col">
        <div class="kanban-header">
            <span>📥 Entrante</span>
            <span class="kanban-badge" id="repo-ent-count">0</span>
        </div>
        <div class="kanban-drop" id="repo-entrantes"></div>
    </div>

    <!-- COLUMNA 2: PROCESO DE COMPRA -->
    <div class="kanban-col">
        <div class="kanban-header">
            <span>🛒 Proceso de Compra</span>
            <span class="kanban-badge" id="repo-proc-count">0</span>
        </div>
        <div class="kanban-drop" id="repo-proceso"></div>
    </div>

    <!-- COLUMNA 3: RECEPCIÓN -->
    <div class="kanban-col">
        <div class="kanban-header">
            <span>📦 Recepción</span>
            <span class="kanban-badge" id="repo-comp-count">0</span>
        </div>
        <div class="kanban-drop" id="repo-completado"></div>
    </div>

    <!-- COLUMNA 4: PROVEEDORES -->
    <div class="kanban-col">
        <div class="kanban-header" style="justify-content:space-between">
            <span>🏬 Proveedores</span>
            <button id="btn-add-proveedor" onclick="appRepoAbrirFormProveedor()" style="font-size:0.75em;padding:2px 6px;background:var(--primary);color:#000;font-weight:bold;border-radius:var(--radius)">+ Nuevo</button>
        </div>
        <div class="kanban-body" style="padding:0;overflow-y:auto;height:420px">
            <table style="width:100%;border-collapse:collapse">
                <thead>
                    <tr style="background:var(--bg-input);font-size:0.75em;color:var(--text-muted);border-bottom:1px solid var(--border)">
                        <th style="padding:4px;text-align:center">Empresa</th>
                        <th style="padding:4px;text-align:center">Contacto</th>
                        <th style="padding:4px;text-align:center">Acción</th>
                    </tr>
                </thead>
                <tbody id="lista-proveedores"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL FORM PROVEEDOR -->
<div id="modal-proveedor" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:400px;max-width:90%">
        <div style="font-weight:600;font-size:1em;margin-bottom:12px" id="prov-form-titulo">Nuevo Proveedor</div>
        <input type="hidden" id="prov-form-id">
        <label style="font-size:0.85em;display:block;margin-bottom:8px">Empresa
            <input type="text" id="prov-form-nombre" style="width:100%;margin-top:2px;padding:6px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius)">
        </label>
        <label style="font-size:0.85em;display:block;margin-bottom:8px">Marcas que vende
            <input type="text" id="prov-form-marcas" placeholder="Ej: Trupan, Maderas del Sur" style="width:100%;margin-top:2px;padding:6px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius)">
        </label>
        <label style="font-size:0.85em;display:block;margin-bottom:8px">Nombre contacto
            <input type="text" id="prov-form-contacto" style="width:100%;margin-top:2px;padding:6px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius)">
        </label>
        <label style="font-size:0.85em;display:block;margin-bottom:8px">Correo
            <input type="email" id="prov-form-email" style="width:100%;margin-top:2px;padding:6px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius)">
        </label>
        <label style="font-size:0.85em;display:block;margin-bottom:8px">Teléfono
            <input type="text" id="prov-form-telefono" style="width:100%;margin-top:2px;padding:6px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius)">
        </label>
        <div style="display:flex;gap:8px;margin-top:12px">
            <button onclick="appRepoGuardarProveedor()" style="background:var(--success);flex:1;font-weight:bold">Guardar</button>
            <button onclick="appRepoCerrarFormProveedor()" style="background:#6c757d;flex:1;font-weight:bold">Cancelar</button>
        </div>
    </div>
</div>

<!-- COLUMNA ANCHA: INVENTARIO -->
<div style="margin-top:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);overflow:hidden">
    <div class="kanban-header" style="justify-content:space-between">
        <span>📦 Inventario General de Reposición</span>
    </div>
    <div class="scroll-box" style="border:none;border-radius:0;padding:0;max-height:350px">
        <table>
            <thead>
                <tr>
                    <th style="text-align:center">ID</th>
                    <th style="text-align:center">SKU</th>
                    <th style="text-align:center">Material</th>
                    <th style="text-align:center">Marca</th>
                    <th style="text-align:center">Color</th>
                    <th style="text-align:center">Espesor</th>
                    <th style="text-align:center">Cantidad</th>
                    <th style="text-align:center">Precio Unit.</th>
                    <th style="text-align:center">Margen</th>
                    <th style="text-align:center">IVA</th>
                    <th style="text-align:center">Precio Venta</th>
                </tr>
            </thead>
            <tbody id="repo-inv-lista"></tbody>
        </table>
    </div>
</div>
