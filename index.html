<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full.Stock | Management Suite & TaskFlow</title>

    <!-- BOOTSTRAP 5.3 CSS & BOOTSTRAP ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- SWEETALERT2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- LIGHT MINIMALIST BENTO STYLES -->
    <link rel="stylesheet" href="fullstock/css/estilos.css?v=9">
</head>
<body>

    <!-- NAVBAR HEADER MINIMALISTA (LIGHT MODE) -->
    <header>
        <nav>
            <span id="brand-app" onclick="navegar('inicio')" style="cursor:pointer;" class="user-select-none text-nowrap">
                <i class="bi bi-box-seam-fill me-1"></i> Full.Stock <span class="text-muted fw-normal" style="font-size:0.85em;">| Tienda Muebles</span>
            </span>
            <div id="nav-center" class="d-flex align-items-center gap-1 flex-grow-1 justify-content-center">
                <a href="#" data-seccion="venta"><i class="bi bi-cart3 me-1"></i> Ventas</a>
                <a href="#" data-seccion="bodega"><i class="bi bi-truck me-1"></i> Bodega</a>
                <a href="#" data-seccion="reposicion"><i class="bi bi-bag-check me-1"></i> Reposición</a>
                <a href="#" data-seccion="inventario"><i class="bi bi-grid-3x3-gap me-1"></i> Inventario</a>
                <a href="#" data-seccion="estadisticas"><i class="bi bi-bar-chart-line me-1"></i> Estadísticas</a>
                <div class="d-flex align-items-center gap-1 ms-4 ps-3 border-start">
                    <div class="navbar-search-wrapper" style="max-width:300px;">
                        <div class="search-bar">
                            <i class="bi bi-search"></i>
                            <input type="text" id="navbar-search" placeholder="Buscar en sección actual..." autocomplete="off">
                        </div>
                        <div id="navbar-search-hint" class="text-muted small ms-2 d-none">Enter: filtrar | Esc: limpiar</div>
                    </div>
                    <button id="btn-api-nav" class="btn btn-outline-secondary btn-sm text-nowrap" title="Cargar API externa">
                        <i class="bi bi-globe me-1"></i> Cargar API
                    </button>
                </div>
            </div>
            <div id="nav-right" class="d-flex align-items-center gap-2">
                <a href="#" data-seccion="opciones"><i class="bi bi-gear me-1"></i> Opciones</a>
                <button id="btn-login-nav" class="btn btn-indigo btn-sm"><i class="bi bi-person-fill me-1"></i> Login</button>
                <button id="btn-logout-nav" class="btn btn-rose btn-sm oculto"><i class="bi bi-box-arrow-right me-1"></i> Logout</button>
            </div>
        </nav>
    </header>

    <!-- CONTAINER CENTRAL AMPLIO Y CÓMODO -->
    <main id="app-contenido" class="container-fluid px-4 px-md-5 py-4">
        <div class="d-flex justify-content-center align-items-center py-5">
            <div class="spinner-border spinner-border-sm text-secondary" role="status">
                <span class="visually-hidden">Cargando Full.Stock...</span>
            </div>
        </div>
    </main>

    <!-- MODAL NUEVA TAREA (POO, EVENTOS FORMULARIO SUBMIT) -->
    <div id="modal-nueva-tarea" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.4);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center">
        <div class="bento-card bg-white shadow-lg" style="width:460px;max-width:92%">
            <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                <h6 class="m-0 fw-bold text-dark"><i class="bi bi-plus-circle-fill me-1 text-primary"></i> Nueva Tarea POO</h6>
                <button type="button" class="btn-close" onclick="cerrarModalNuevaTarea()"></button>
            </div>
            <form id="form-nueva-tarea">
                <div class="mb-2">
                    <label class="form-label small fw-semibold">Tipo de Tarea</label>
                    <select id="nt-tipo" class="form-select">
                        <option value="entrega">Entrega (Bodega)</option>
                        <option value="reposicion">Reposición (Compras)</option>
                    </select>
                </div>

                <div class="mb-2">
                    <label class="form-label small fw-semibold">Descripción / Material</label>
                    <input type="text" id="nt-material" class="form-control" placeholder="Ej. Melamina Blanco 18mm" required>
                </div>

                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Cantidad</label>
                        <input type="number" id="nt-cantidad" class="form-control" min="1" value="1" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Prioridad</label>
                        <select id="nt-prioridad" class="form-select">
                            <option value="normal">Normal</option>
                            <option value="urgente">🔴 Urgente</option>
                            <option value="baja">🟢 Baja</option>
                        </select>
                    </div>
                </div>

                <div class="mb-2">
                    <label class="form-label small fw-semibold">Fecha Límite</label>
                    <input type="datetime-local" id="nt-fecha-limite" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Notas / Detalles</label>
                    <textarea id="nt-notas" class="form-control" rows="2" placeholder="Instrucciones específicas..."></textarea>
                </div>

                <div id="nt-spinner" style="display:none;" class="text-center mb-2 text-primary small">
                    <div class="spinner-border spinner-border-sm me-1" role="status"></div> Procesando asincrónico (1.5s)...
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" id="nt-btn-submit" class="btn btn-indigo flex-grow-1">Guardar Tarea</button>
                    <button type="button" onclick="cerrarModalNuevaTarea()" class="btn btn-light border px-3">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL EDITAR ATRIBUTOS DE TAREA -->
    <div id="modal-editar-alerta" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.4);backdrop-filter:blur(4px);z-index:10000;align-items:center;justify-content:center">
        <div class="bento-card bg-white shadow-lg" style="width:420px;max-width:92%">
            <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                <h6 class="m-0 fw-bold text-dark" id="alerta-edit-titulo"><i class="bi bi-pencil-square me-1 text-primary"></i> Editar Tarea</h6>
                <button type="button" class="btn-close" onclick="appCerrarModalEditarAlerta()"></button>
            </div>
            <input type="hidden" id="alerta-edit-idx">
            <input type="hidden" id="alerta-edit-origen">
            <input type="hidden" id="alerta-edit-tipo-target">

            <!-- Tipo de Entrega (solo venta→bodega) -->
            <div class="mb-2" id="alerta-edit-entrega-wrap">
                <label class="form-label small fw-semibold">Tipo de Entrega</label>
                <select id="alerta-edit-entrega" class="form-select">
                    <option value="inmediata">Entrega Inmediata</option>
                    <option value="domicilio">Envío a Domicilio</option>
                </select>
            </div>

            <!-- Fecha Entrega (solo si domicilio) -->
            <div class="mb-2" id="alerta-edit-fecha-wrap" style="display:none;">
                <label class="form-label small fw-semibold">Fecha de Entrega</label>
                <input type="date" id="alerta-edit-fecha" class="form-control">
            </div>

            <!-- Prioridad (venta→reposicion, bodega) -->
            <div class="mb-2" id="alerta-edit-prioridad-wrap" style="display:none;">
                <label class="form-label small fw-semibold">Prioridad</label>
                <select id="alerta-edit-prioridad" class="form-select">
                    <option value="baja">Baja</option>
                    <option value="normal">Normal</option>
                    <option value="alta">Alta</option>
                    <option value="urgente">Urgente</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Notas / Observaciones</label>
                <textarea id="alerta-edit-notas" class="form-control" rows="2" placeholder="Instrucciones adicionales..."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button onclick="appGuardarAtributosAlerta()" class="btn btn-indigo flex-grow-1">Guardar Cambios</button>
                <button onclick="appCerrarModalEditarAlerta()" class="btn btn-light border px-3">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- TOOLTIP KANBAN MOUSEOVER -->
    <div id="app-tooltip" style="display:none;position:fixed;z-index:10000;background:#0f172a;color:#ffffff;padding:8px 12px;border-radius:6px;font-size:0.78em;box-shadow:0 6px 16px rgba(0,0,0,0.15);pointer-events:none;max-width:280px"></div>

    <!-- NOTIFICACIONES ASINCRÓNICAS -->
    <div id="app-notifications" style="position:fixed;bottom:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px"></div>

    <!-- BOOTSTRAP, SWEETALERT & CHART.JS SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="fullstock/js/swal.js?v=10"></script>
    <script src="fullstock/js/data.js?v=10"></script>
    <script src="fullstock/js/app.js?v=10"></script>
</body>
</html>
